name: laravel-app

x-php-env: &php-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: ${APP_URL:?Set APP_URL in .env}
  DEFAULT_URI: ${APP_URL:?Set APP_URL in .env}
  OCTANE_SERVER: frankenphp
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: database
  HEALTH_CHECK_ELASTICSEARCH: "false"
  HEALTH_CHECK_REDIS: "false"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-laravel-database}
  DB_USERNAME: ${DB_USERNAME:-laravel-database-user}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  MAIL_MAILER: log
  LOG_LEVEL: ${LOG_LEVEL:-warning}

x-php-depends: &php-depends
  postgres:
    condition: service_healthy

x-php-build: &php-build
  context: .
  target: ${PHP_BUILD_TARGET:-dev}
  args:
    BASE_IMAGE: dunglas/frankenphp:1-php8.5-alpine@sha256:2e95565f69e5295e1a0a5ceb5dc81b6039c9e552e819da47f8c313f466926a83

services:
  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - php
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8099}:80"
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - backend

  php:
    build: *php-build
    platform: linux/amd64
    environment:
      <<: *php-env
    depends_on:
      <<: *php-depends
    networks:
      - backend

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel-database}
      POSTGRES_USER: ${DB_USERNAME:-laravel-database-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
