x-prod-php-env: &prod-php-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: ${APP_URL:?Set APP_URL in .env}
  DEFAULT_URI: ${APP_URL:?Set APP_URL in .env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  HEALTH_CHECK_ELASTICSEARCH: "false"
  HEALTH_CHECK_REDIS: "false"
  MAIL_MAILER: log
  LOG_LEVEL: warning

services:
  caddy:
    ports: !override
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8099}:80"
    volumes: !override
      - ./public:/var/www/app/public:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  php:
    build:
      target: prod
    environment:
      <<: *prod-php-env
    depends_on: !override
      postgres:
        condition: service_healthy
    volumes: !override []

  worker:
    profiles: [full-stack]
    build:
      target: prod
    environment:
      <<: *prod-php-env
    volumes: !override []

  scheduler:
    profiles: [full-stack]
    build:
      target: prod
    environment:
      <<: *prod-php-env
    volumes: !override []

  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

  redis:
    profiles: [full-stack]
    ports: !override []

  elasticsearch:
    profiles: [full-stack]
    ports: !override []

  mailpit:
    profiles: [full-stack]
    ports: !override []
